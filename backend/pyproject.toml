[project]
name = "trailcam"
version = "0.1.0"
description = "Trail Camera Analyzer: ingest trail-camera media and learn deer movement patterns."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "geoalchemy2>=0.15",
    "pgvector>=0.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[project.scripts]
trailcam-worker = "trailcam.pipeline.runner:main"
trailcam-migrate = "trailcam.db.migrate:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trailcam"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["alembic/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL", "PT", "TID", "S"]
ignore = [
    "PLR0913",  # many-argument functions are fine for job/queue APIs
    "PLR2004",  # magic values are fine in tests and thresholds
    "S101",     # assert is used in tests
    "S311",     # random is not used for crypto
    "S608",     # SQL is built only from static identifiers
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "TID251", "PLC0415", "PT022"]
"src/trailcam/api/**" = ["TID251"]
"alembic/**" = ["E501"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"trailcam.api".msg = "Nothing may depend on the API layer (DESIGN §7 layering)."

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["trailcam"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "trailcam.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a PostgreSQL database with PostGIS + pgvector (TRAILCAM_TEST_DATABASE_URL)",
    "gpu: needs an NVIDIA GPU",
]
filterwarnings = ["error::DeprecationWarning:trailcam.*"]

[tool.coverage.run]
source = ["trailcam"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
